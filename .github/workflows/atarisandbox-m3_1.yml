name: AtariSandbox M3.1

on:
  push:
    branches: [main]
    paths:
      - 'tools/qualify_m3_1.py'
      - 'tools/atarisandbox_os_trace_events.py'
      - 'tools/atarisandbox_run.py'
      - '.github/workflows/atarisandbox-m3_1.yml'
      - 'docs/M3_1_REAL_OS_API_RUNTIME.md'
      - 'docs/ROADMAP.md'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - 'tools/qualify_m3_1.py'
      - 'tools/atarisandbox_os_trace_events.py'
      - 'tools/atarisandbox_run.py'
      - '.github/workflows/atarisandbox-m3_1.yml'
      - 'docs/M3_1_REAL_OS_API_RUNTIME.md'
      - 'docs/ROADMAP.md'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emutos-os-api-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libsdl2-dev libsdl2-2.0-0 libpng-dev zlib1g-dev \
            libreadline-dev portaudio19-dev libudev-dev \
            xvfb curl unzip python3

      - name: Build AtariSandbox
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          test -x build/src/hatari
          build/src/hatari --version

      - name: Fetch official EmuTOS 1.4 512 KiB ROM package
        run: |
          EMUTOS_URL='https://sourceforge.net/projects/emutos/files/emutos/1.4/emutos-512k-1.4.zip/download'
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/emutos.zip "$EMUTOS_URL"
          unzip -t /tmp/emutos.zip
          rm -rf /tmp/emutos
          mkdir -p /tmp/emutos
          unzip -q /tmp/emutos.zip -d /tmp/emutos
          ROM="$(find /tmp/emutos -type f -name 'etos512*.img' -print -quit)"
          test -n "$ROM"
          cp "$ROM" /tmp/emutos512k.img
          test "$(stat -c %s /tmp/emutos512k.img)" -eq 524288
          sha256sum /tmp/emutos512k.img

      - name: Run AtariSandbox M3.1 qualification
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          rm -rf /tmp/atarisandbox-m3_1
          mkdir -p /tmp/atarisandbox-m3_1
          xvfb-run -a python3 tools/qualify_m3_1.py \
            --analysis-dir /tmp/atarisandbox-m3_1 \
            --hatari "$PWD/build/src/hatari" \
            --rom /tmp/emutos512k.img \
            --backend-revision "$GITHUB_SHA" \
            --runtime-seconds 8

      - name: Validate M3.1 evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/atarisandbox-m3_1')
          q = json.loads((p/'qualification-m3_1.json').read_text())
          s = json.loads((p/'session.json').read_text())
          events = [json.loads(line) for line in (p/'events.jsonl').read_text().splitlines() if line.strip()]
          assert q['schema'] == 'atarisandbox.m3_1.qualification/1'
          assert q['result'] == 'PASS'
          assert q['gemdos_events'] > 0
          assert q['bios_events'] > 0
          assert q['xbios_events'] > 0
          assert s['completed'] is True
          for api in ('gemdos', 'bios', 'xbios'):
              matches = [e for e in events if e.get('type') == f'os.{api}.call']
              assert matches, api
              assert all(e.get('schema') == 'atarisandbox.event/1' for e in matches)
          assert (p/'hatari-os-trace.log').is_file()
          assert (p/'os-events.jsonl').is_file()
          assert (p/'emutos.sha256').is_file()
          print('M3.1 real OS API runtime evidence PASS')
          PY

      - name: Upload M3.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atarisandbox-m3_1-runtime-evidence
          path: /tmp/atarisandbox-m3_1
          if-no-files-found: warn
