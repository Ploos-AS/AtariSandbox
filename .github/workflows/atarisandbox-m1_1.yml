name: AtariSandbox M2.2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  emutos-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libsdl2-dev libsdl2-2.0-0 libpng-dev zlib1g-dev \
            libreadline-dev portaudio19-dev libudev-dev \
            xvfb curl unzip python3

      - name: Build AtariSandbox
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          test -x build/src/hatari
          build/src/hatari --version

      - name: Fetch official EmuTOS 1.4 512 KiB ROM package
        run: |
          EMUTOS_URL='https://sourceforge.net/projects/emutos/files/emutos/1.4/emutos-512k-1.4.zip/download'
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/emutos.zip "$EMUTOS_URL"
          test -s /tmp/emutos.zip
          unzip -t /tmp/emutos.zip
          rm -rf /tmp/emutos
          mkdir -p /tmp/emutos
          unzip -q /tmp/emutos.zip -d /tmp/emutos
          ROM="$(find /tmp/emutos -type f -name 'etos512*.img' -print -quit)"
          test -n "$ROM"
          test -s "$ROM"
          cp "$ROM" /tmp/emutos512k.img
          test "$(stat -c %s /tmp/emutos512k.img)" -eq 524288
          sha256sum /tmp/emutos512k.img

      - name: Run AtariSandbox M2.2 qualification
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          rm -rf /tmp/atarisandbox-m2_2
          mkdir -p /tmp/atarisandbox-m2_2
          xvfb-run -a python3 tools/qualify_m1_1.py \
            --analysis-dir /tmp/atarisandbox-m2_2 \
            --hatari "$PWD/build/src/hatari" \
            --rom /tmp/emutos512k.img \
            --backend-revision "$GITHUB_SHA" \
            --runtime-seconds 8 \
            --memory-write-limit 256

      - name: Validate M2.2 evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/atarisandbox-m2_2')
          q = json.loads((p/'qualification.json').read_text())
          s = json.loads((p/'session.json').read_text())
          events = [json.loads(line) for line in (p/'events.jsonl').read_text().splitlines() if line.strip()]
          snapshots = [e for e in events if e.get('type') == 'cpu.exception.snapshot']
          trace = [e for e in events if e.get('type') == 'cpu.exception']
          writes = [e for e in events if e.get('type') == 'memory.write']
          assert q['schema'] == 'atarisandbox.m2_2.qualification/1'
          assert q['result'] == 'PASS'
          assert q['cpu_exception_events'] > 0
          assert q['cpu_exception_snapshot_events'] > 0
          assert 0 < q['memory_write_events'] <= q['memory_write_limit'] == 256
          assert s['schema'] == 'atarisandbox.session/1'
          assert s['machine_profile'] == 'st-emutos-ci'
          assert trace and snapshots and writes
          for e in writes:
              assert e['schema'] == 'atarisandbox.event/1'
              assert e['source'] == 'atarisandbox.memory_core'
              assert e['size'] in (1, 2, 4)
              for key in ('address', 'value', 'pc', 'instruction_pc', 'cycles'):
                  assert isinstance(e[key], int)
          assert (p/'core-events.jsonl').is_file()
          assert (p/'trace-events.jsonl').is_file()
          assert (p/'emutos.sha256').is_file()
          assert (p/'hatari-trace.log').is_file()
          print(f"M2.2 bounded memory-write evidence PASS: {len(writes)} writes")
          PY

      - name: Upload M2.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atarisandbox-m2_2-runtime-evidence
          path: /tmp/atarisandbox-m2_2
          if-no-files-found: warn

  m4_4-visual-memory-evidence:
    name: M4.4 visual and memory evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libsdl2-dev libsdl2-2.0-0 libpng-dev zlib1g-dev \
            libreadline-dev portaudio19-dev libudev-dev \
            xvfb curl unzip python3

      - name: Build AtariSandbox
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          test -x build/src/hatari
          build/src/hatari --version

      - name: Fetch official EmuTOS 1.4 512 KiB ROM package
        run: |
          EMUTOS_URL='https://sourceforge.net/projects/emutos/files/emutos/1.4/emutos-512k-1.4.zip/download'
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/emutos.zip "$EMUTOS_URL"
          unzip -t /tmp/emutos.zip
          rm -rf /tmp/emutos
          mkdir -p /tmp/emutos
          unzip -q /tmp/emutos.zip -d /tmp/emutos
          ROM="$(find /tmp/emutos -type f -name 'etos512*.img' -print -quit)"
          test -n "$ROM"
          cp "$ROM" /tmp/emutos512k.img
          test "$(stat -c %s /tmp/emutos512k.img)" -eq 524288
          sha256sum /tmp/emutos512k.img

      - name: Run AtariSandbox M4.4 qualification
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          rm -rf /tmp/atarisandbox-m4_4
          mkdir -p /tmp/atarisandbox-m4_4
          xvfb-run -a python3 tools/qualify_m4_4.py \
            --analysis-dir /tmp/atarisandbox-m4_4 \
            --hatari "$PWD/build/src/hatari" \
            --rom /tmp/emutos512k.img \
            --backend-revision "$GITHUB_SHA" \
            --runtime-seconds 8

      - name: Validate M4.4 evidence
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p = Path('/tmp/atarisandbox-m4_4')
          q = json.loads((p/'qualification-m4_4.json').read_text())
          m = json.loads((p/'evidence-m4_4.json').read_text())
          assert q['schema'] == 'atarisandbox.m4_4.qualification/1'
          assert q['result'] == 'PASS'
          assert q['screenshot_captured'] is True
          assert q['memory_snapshot_captured'] is True
          assert q['analysis_directory_only'] is True
          assert m['schema'] == 'atarisandbox.m4_4.evidence/1'
          assert m['object_count'] == 2
          assert {o['kind'] for o in m['objects']} == {'screenshot', 'memory_snapshot'}
          for obj in m['objects']:
              evidence = p/obj['path']
              assert evidence.is_file()
              assert evidence.stat().st_size == obj['bytes']
              assert hashlib.sha256(evidence.read_bytes()).hexdigest() == obj['sha256']
          print('M4.4 visual/memory evidence PASS')
          PY

      - name: Upload M4.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atarisandbox-m4_4-runtime-evidence
          path: /tmp/atarisandbox-m4_4
          if-no-files-found: warn

  m5-asw-adapter:
    name: M5 ASW adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libsdl2-dev libsdl2-2.0-0 libpng-dev zlib1g-dev \
            libreadline-dev portaudio19-dev libudev-dev \
            xvfb curl unzip python3

      - name: Build AtariSandbox
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          test -x build/src/hatari

      - name: Fetch official EmuTOS 1.4 512 KiB ROM package
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/emutos.zip \
            'https://sourceforge.net/projects/emutos/files/emutos/1.4/emutos-512k-1.4.zip/download'
          rm -rf /tmp/emutos && mkdir -p /tmp/emutos
          unzip -q /tmp/emutos.zip -d /tmp/emutos
          ROM="$(find /tmp/emutos -type f -name 'etos512*.img' -print -quit)"
          test -n "$ROM"
          cp "$ROM" /tmp/emutos512k.img
          test "$(stat -c %s /tmp/emutos512k.img)" -eq 524288

      - name: Generate harmless M4.4 evidence
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          rm -rf /tmp/atarisandbox-m5
          mkdir -p /tmp/atarisandbox-m5
          xvfb-run -a python3 tools/qualify_m4_4.py \
            --analysis-dir /tmp/atarisandbox-m5 \
            --hatari "$PWD/build/src/hatari" \
            --rom /tmp/emutos512k.img \
            --backend-revision "$GITHUB_SHA" \
            --runtime-seconds 8

      - name: Run M5 ASW adapter
        run: |
          python3 tools/atarisandbox_asw_adapter.py \
            --analysis-dir /tmp/atarisandbox-m5

      - name: Validate ASW ingestion manifest
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/atarisandbox-m5')
          m = json.loads((root/'asw-manifest.json').read_text())
          assert m['schema'] == 'atarisandbox.asw-ingest/1'
          assert m['producer'] == 'AtariSandbox'
          assert m['network_enabled'] is False
          assert m['host_shared_folders_enabled'] is False
          assert 1 <= m['object_count'] <= 16
          assert m['object_count'] == len(m['objects'])
          src = root/m['source_evidence']
          assert hashlib.sha256(src.read_bytes()).hexdigest() == m['source_evidence_sha256']
          for obj in m['objects']:
              p = root/obj['path']
              assert p.is_file()
              assert p.stat().st_size == obj['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == obj['sha256']
          print('M5 ASW adapter PASS')
          PY

      - name: Upload M5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atarisandbox-m5-asw-evidence
          path: /tmp/atarisandbox-m5
          if-no-files-found: warn
